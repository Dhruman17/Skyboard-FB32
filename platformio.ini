; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev_3port

[env:esp32dev_3port]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
board_build.partitions = min_spiffs.csv
build_flags = 
    -DESP32_THREE_PORT
    
lib_deps =
    ArduinoJson
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14
    esphome/ESPAsyncWebServer-esphome @ 3.3.0
    tzapu/WiFiManager@^2.0.17
    pilotak/MCP3X21@^1.0.1
    closedcube/ClosedCube HDC1080@^1.3.2
    adafruit/Adafruit SGP30 Sensor@^2.0.3
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
; upload_protocol = espota
; upload_port = 10.0.0.78 ; <- Replace with your ESP32’s IP or hostname
[env:esps3_board]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 9600
board_build.partitions = min_spiffs.csv
build_flags =
    -DESP32_S3
lib_deps = ${env:esp32dev_3port.lib_deps}
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
; upload_protocol = espota
; upload_port = THQ.local  ; <- Replace with your ESP32's IP or hostnam

[env:ec_calibration]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
lib_deps =
    pilotak/MCP3X21@^1.0.1
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
build_src_filter =
    -<*>
    +<ec_calibration.cpp>